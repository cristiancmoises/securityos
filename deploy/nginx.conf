# SecurityOS — hardened nginx reverse-proxy / static-server example.
#
# Use this when you serve the `next export` output (static files) or proxy the
# Node server (`next start`) behind nginx for TLS termination. The security
# headers below MIRROR scripts/securityHeaders.js — keep them in sync (that JS
# module is the source of truth; this file exists because static export ignores
# next.config.js headers()).
#
#   docker:  see deploy/docker-compose.yml
#   test:    curl -sI https://your-host/ | grep -iE 'content-security|strict-transport|x-frame'

server {
    listen 443 ssl http2;
    server_name os.securityops.co;

    # --- TLS (point these at your certs / certbot output) ---------------------
    ssl_certificate     /etc/letsencrypt/live/os.securityops.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.securityops.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Security headers (applied to every response, including errors) -------
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob: https:; connect-src 'self' data: blob: https: wss:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https: blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(self), fullscreen=(self), gamepad=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # --- Option A: serve the static `next export` output ----------------------
    root /var/www/securityos/out;
    index index.html;
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # --- Option B: proxy the Node server (`next start`, port 3000) -------------
    # Comment out Option A above and uncomment this block instead.
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;       # WebSocket (v86 relay/IRC)
    #     proxy_set_header Connection "upgrade";
    # }
}

# Redirect plain HTTP -> HTTPS
server {
    listen 80;
    server_name os.securityops.co;
    return 308 https://$host$request_uri;
}
